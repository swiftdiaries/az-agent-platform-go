# Journey definitions (strict YAML; see docs/design.md "Journey definition").
# Operation keys and the _meta key name are integration inputs agreed with the Java team.
conversation_prompt: conversation.md
catalog:
  operation_meta_key: operation_key
  call_id_header: X-Platform-Call-ID
journeys:
  - id: vacation-planner
    skill: skills/planner
    tools:
      - op: lookup_destination
        class: read_only
  - id: shift-swap
    skill: skills/shift-swap
    tools:
      - op: lookup_shift
        class: read_only
      - op: request_shift_swap
