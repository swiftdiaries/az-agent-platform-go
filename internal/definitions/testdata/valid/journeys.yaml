catalog:
  operation_meta_key: com.example/operation
  call_id_header: x-platform-call-id
journeys:
  - id: vacation-planner
    skill: skills/planner/
    system_prompt: prompts/planner.md
    routing: {default: true, keywords: [Vacation, " Leave "], priority: 10}
    product_versions: {min: "2026.2", max_exclusive: "2027.1"}
    tools:
      - op: leave.balance
      - op: [leave.request.v2, leave.request]
        class: idempotent
        approval: required
      - tags: [leave, self-service]
        read_only: true
    deny: [leave.delete]
  - id: expenses
    skill: skills/expenses
    system_prompt: prompts/expenses.md
    routing: {keywords: [expense, receipt], priority: 20}
    max_tools: 3
    tools:
      - op: expense.submit
        class: effectful
